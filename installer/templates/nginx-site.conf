server {
    listen __BIND_80__;
    server_name __DOMAIN__;

    root __ROOT__;
    index index.php index.html;
    # www-data is in every site's group, so without this a site could link to
    # another site's files and have them served. A link is followed only when
    # it and its target have the same owner. No from=: the document root
    # itself is checked too, since the site user can replace www with a link.
    disable_symlinks if_not_owner;

    client_max_body_size 64m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/schela/acme;
        default_type text/plain;
        allow all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:__SOCKET__;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
