# Schela panel. Rendered by schela-apply (write_panel_vhost); edits here are
# overwritten on the next apply.

# Port 80, any name: ACME challenges for every Host (site certificates depend
# on them), nothing else.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/schela/acme;
        default_type text/plain;
    }

    location / {
        return 444;
    }
}

# Port 80, panel names: ACME challenges, everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name __PANEL_NAMES__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/schela/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 443, a name that is neither the panel's nor a site's (SNI or Host), or
# no Host at all: refused before anything reaches the panel.
server {
    listen __LISTEN_443__;
    server_name "" ~.;
__REJECT_TLS__
    return 444;
}

# The panel by hostname: Let's Encrypt when issued, else the self-signed one.
server {
    listen __LISTEN_443__;
    server_name __HOSTNAME__;

    ssl_certificate /var/lib/schela/tls/host.crt;
    ssl_certificate_key /var/lib/schela/tls/host.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;

    client_max_body_size 64m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
__HSTS__

    location / {
        proxy_pass http://127.0.0.1:__PANEL_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# The panel by server IP. Clients send no SNI for an address, so this is the
# default server and holds the self-signed certificate. Never HSTS here.
server {
    listen __LISTEN_443_DEFAULT__;
    server_name __IP_NAMES__;

    ssl_certificate /var/lib/schela/tls/self-signed.crt;
    ssl_certificate_key /var/lib/schela/tls/self-signed.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;

    client_max_body_size 64m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:__PANEL_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
